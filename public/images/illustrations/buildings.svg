    <rect x="200" y="110" width="22" height="30"/>
    <rect x="225" y="110" width="22" height="30"/>
    <rect x="170" y="150" width="22" height="30"/>
    <rect x="200" y="150" width="22" height="30"/>
    <rect x="225" y="150" width="22" height="30"/>
    <rect x="170" y="190" width="22" height="30"/>
    <rect x="200" y="190" width="22" height="30"/>
    <rect x="225" y="190" width="22" height="30"/>
    <rect x="170" y="230" width="22" height="30"/>
    <rect x="200" y="230" width="22" height="30"/>
    <rect x="225" y="230" width="22" height="30"/>
  </g>
  <rect x="155" y="305" width="100" height="15" fill="#3d718a"/>

  <!-- Right building -->
  <rect x="260" y="130" width="80" height="190" fill="#a0c4d8"/>
  <!-- Vertical stripes -->
  <g fill="#c3dbe6">
    <rect x="268" y="140" width="6" height="165"/>
    <rect x="278" y="140" width="6" height="165"/>
    <rect x="288" y="140" width="6" height="165"/>
    <rect x="298" y="140" width="6" height="165"/>
