<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Left building (rounded top) -->
  <path d="M 80 160 L 80 320 L 150 320 L 150 160 Q 150 120 115 120 Q 80 120 80 160 Z" fill="#8ab4ca"/>
  <!-- Left building windows (4 rows x 3 cols) -->
  <g fill="#d9e8f0">
    <rect x="90" y="155" width="12" height="16"/>
    <rect x="110" y="155" width="12" height="16"/>
    <rect x="130" y="155" width="12" height="16"/>
    <rect x="90" y="180" width="12" height="16"/>
    <rect x="110" y="180" width="12" height="16"/>
    <rect x="130" y="180" width="12" height="16"/>
    <rect x="90" y="205" width="12" height="16"/>
    <rect x="110" y="205" width="12" height="16"/>
    <rect x="130" y="205" width="12" height="16"/>
    <rect x="90" y="230" width="12" height="16"/>
    <rect x="110" y="230" width="12" height="16"/>
    <rect x="130" y="230" width="12" height="16"/>
  </g>
  <rect x="85" y="305" width="60" height="15" fill="#3d718a"/>

  <!-- Middle building (tallest) -->
  <rect x="155" y="90" width="100" height="230" fill="#c3dbe6"/>
  <g fill="#ffffff" stroke="#a8c4d4" stroke-width="1">
