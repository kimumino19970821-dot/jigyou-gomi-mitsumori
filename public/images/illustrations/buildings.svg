  <!-- Trees -->
  <!-- Tree 1 -->
  <ellipse cx="165" cy="295" rx="18" ry="20" fill="#6ea856"/>
  <ellipse cx="155" cy="290" rx="12" ry="15" fill="#589040"/>
  <ellipse cx="175" cy="290" rx="12" ry="15" fill="#7bbc63"/>
  <rect x="162" y="310" width="6" height="15" fill="#5a7a40"/>
  <!-- Tree 2 -->
  <ellipse cx="305" cy="295" rx="18" ry="20" fill="#6ea856"/>
  <ellipse cx="295" cy="290" rx="12" ry="15" fill="#589040"/>
  <ellipse cx="315" cy="290" rx="12" ry="15" fill="#7bbc63"/>
  <rect x="302" y="310" width="6" height="15" fill="#5a7a40"/>
