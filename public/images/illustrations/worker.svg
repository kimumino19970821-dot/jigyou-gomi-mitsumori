  <!-- Zipper line -->
  <line x1="200" y1="140" x2="200" y2="230" stroke="#3d5d7a" stroke-width="2"/>

  <!-- Left arm (raised to helmet) -->
  <path d="M 165 130 Q 150 140 145 160 Q 145 180 165 185 L 175 170 Q 170 150 180 140 Z" fill="#5a7a9a"/>
  <!-- Right arm (down) -->
