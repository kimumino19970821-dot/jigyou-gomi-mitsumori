<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Shadow platform -->
  <ellipse cx="200" cy="360" rx="75" ry="12" fill="#3a3a3a"/>
  <ellipse cx="200" cy="355" rx="72" ry="10" fill="#9a9a9a"/>

  <!-- Left shoe -->
  <ellipse cx="175" cy="350" rx="18" ry="7" fill="#2a2a2a"/>
  <!-- Right shoe -->
  <ellipse cx="220" cy="350" rx="18" ry="7" fill="#2a2a2a"/>

  <!-- Pants -->
  <path d="M 170 240 L 160 345 L 185 345 L 195 270 L 205 270 L 215 345 L 240 345 L 230 240 Z" fill="#5a7a9a"/>

  <!-- Belt -->
  <rect x="168" y="235" width="65" height="8" fill="#3d5d7a"/>

  <!-- Body / top -->
