  <ellipse cx="200" cy="50" rx="30" ry="5" fill="#c8c8c8"/>
  <rect x="168" y="80" width="64" height="4" fill="#b8b8b8"/>

  <!-- Eyes -->
  <ellipse cx="192" cy="88" rx="1.5" ry="2.5" fill="#2a2a2a"/>
  <ellipse cx="208" cy="88" rx="1.5" ry="2.5" fill="#2a2a2a"/>
</svg>
